<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1090" viewBox="0 0 1500 1090" role="img" aria-labelledby="title desc">
  <title id="title">Siri 动态气泡：复刻方案示意</title>
  <desc id="desc">五个独立面板说明建议的视觉分层：灵动岛遮罩与气泡轮廓、背景折射与上暗下透、水平双色流动光带、轮廓高光与柔光、状态与幅度驱动。此图是代码原生设计示意，不是 Apple 截图，也不代表其真实内部实现。</desc>
  <defs>
    <linearGradient id="cardStroke" x2="0" y2="1">
      <stop stop-color="#dfe5ee"/><stop offset="1" stop-color="#e9edf4"/>
    </linearGradient>
    <linearGradient id="glassShade" x2="0" y2="1">
      <stop offset="0" stop-color="#080b15" stop-opacity=".99"/>
      <stop offset=".48" stop-color="#11172a" stop-opacity=".92"/>
      <stop offset=".77" stop-color="#54638a" stop-opacity=".36"/>
      <stop offset="1" stop-color="#dfe6ff" stop-opacity=".13"/>
    </linearGradient>
    <linearGradient id="warmCold">
      <stop stop-color="#ff7d62"/><stop offset=".27" stop-color="#ffbd7b"/>
      <stop offset=".49" stop-color="#eaa5de"/><stop offset=".68" stop-color="#947dff"/>
      <stop offset="1" stop-color="#68cfff"/>
    </linearGradient>
    <linearGradient id="rim" x2="0" y2="1">
      <stop stop-color="#b8c0db" stop-opacity=".2"/>
      <stop offset=".45" stop-color="#e8edff" stop-opacity=".66"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".9"/>
    </linearGradient>
    <radialGradient id="softFloor">
      <stop stop-color="#b1b9ff" stop-opacity=".75"/>
      <stop offset=".62" stop-color="#c3c9ff" stop-opacity=".28"/>
      <stop offset="1" stop-color="#c3c9ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="bandBlur" x="-30%" y="-100%" width="160%" height="300%">
      <feGaussianBlur stdDeviation="6 4"/>
    </filter>
    <filter id="rimBlur" x="-40%" y="-100%" width="180%" height="300%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <path id="bubble" d="M151 28 H275 C307 28 328 50 331 82 L336 132 C339 164 314 183 283 184 H143 C112 183 87 164 90 132 L95 82 C98 50 119 28 151 28Z"/>
    <clipPath id="bubbleClip"><use href="#bubble"/></clipPath>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#a4b2cc" stroke-opacity=".32"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0L7 4L0 8" fill="none" stroke="#8390aa" stroke-width="1.4"/>
    </marker>
    <style>
      text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif}
      .title{font-size:39px;font-weight:650;fill:#152138}
      .subtitle{font-size:19px;fill:#63718b}
      .card{fill:#fff;stroke:url(#cardStroke);stroke-width:1.5}
      .heading{font-size:24px;font-weight:600;fill:#1d2a42}
      .number{font-size:18px;font-weight:650;fill:#fff;text-anchor:middle}
      .body{font-size:18px;fill:#3f506b}
      .note{font-size:16px;fill:#738099}
      .small{font-size:15px;fill:#65748f}
      .stage{fill:#edf1f8}
      .label{font-size:15px;font-weight:500;fill:#dde5fb}
    </style>
  </defs>

  <rect width="1500" height="1090" fill="#f4f6fa"/>
  <rect x="40" y="41" width="6" height="48" rx="3" fill="#667bea"/>
  <text x="63" y="79" class="title">Siri 动态气泡 · 复刻方案示意</text>
  <text x="64" y="119" class="subtitle">将观察到的外观拆成五层，便于在 Shader 中独立调整，再按同一轮廓合成。</text>
  <rect x="1216" y="48" width="242" height="35" rx="17.5" fill="#e6ebf8"/>
  <text x="1337" y="72" text-anchor="middle" font-size="16" fill="#52638c">设计示意 · 非真实内部实现</text>

  <!-- Each card illustrates one proposed responsibility, not an Apple render pass. -->
  <g transform="translate(40 158)">
    <rect class="card" width="460" height="372" rx="22"/>
    <circle cx="35" cy="36" r="16" fill="#637ae5"/><text x="35" y="42" class="number">1</text>
    <text x="63" y="44" class="heading">灵动岛遮罩 + 气泡轮廓</text>
    <rect x="18" y="69" width="424" height="203" rx="15" class="stage"/>
    <g transform="translate(18 69)">
      <rect x="28" y="56" width="112" height="31" rx="15.5" fill="#080b13"/>
      <text x="84" y="123" class="small" text-anchor="middle">收起</text>
      <path d="M160 75H206" fill="none" stroke="#8390aa" stroke-width="1.5" marker-end="url(#arrow)"/>
      <path d="M262 38H330C352 38 368 55 370 77L374 129C376 151 359 165 337 165H255C233 165 216 151 218 129L222 77C224 55 240 38 262 38Z" fill="#090d18"/>
      <rect x="249" y="39" width="95" height="27" rx="13.5" fill="#030408"/>
      <path d="M262 38H330C352 38 368 55 370 77L374 129C376 151 359 165 337 165H255C233 165 216 151 218 129L222 77C224 55 240 38 262 38Z" fill="none" stroke="#aebbd7" stroke-width="1.2" stroke-dasharray="4 4"/>
      <path d="M296 86V125" stroke="#8494ba" stroke-width="1.5" marker-end="url(#arrow)"/>
      <text x="296" y="190" class="small" text-anchor="middle">向下展开</text>
    </g>
    <text x="25" y="306" class="body">统一圆角形状；固定顶部，向下延展。</text>
    <text x="25" y="337" class="note">同一遮罩约束玻璃、光带和边缘。</text>
  </g>

  <g transform="translate(520 158)">
    <rect class="card" width="460" height="372" rx="22"/>
    <circle cx="35" cy="36" r="16" fill="#637ae5"/><text x="35" y="42" class="number">2</text>
    <text x="63" y="44" class="heading">背景折射 + 上暗下透</text>
    <rect x="18" y="69" width="424" height="203" rx="15" class="stage"/>
    <g transform="translate(18 69)">
      <rect x="19" y="14" width="386" height="176" rx="8" fill="url(#grid)"/>
      <text x="36" y="161" fill="#98a7c2" font-size="28">Aa</text>
      <text x="358" y="161" fill="#98a7c2" font-size="28">Bb</text>
      <g clip-path="url(#bubbleClip)">
        <rect x="87" y="28" width="251" height="157" fill="#e2e8f7"/>
        <path d="M117 80Q127 130 101 186M151 80Q171 136 146 186M186 80Q205 137 191 186M220 80Q244 137 236 186M255 80Q291 130 282 186M289 80Q335 130 330 186" fill="none" stroke="#b0bdd5" stroke-width="1.4"/>
        <path d="M85 134Q211 120 340 134M85 164Q211 142 340 164" fill="none" stroke="#b0bdd5" stroke-width="1.4"/>
        <text x="143" y="177" fill="#8392b0" font-size="51" font-weight="550" transform="skewX(-5)">Aa Bb</text>
        <use href="#bubble" fill="url(#glassShade)"/>
      </g>
      <use href="#bubble" fill="none" stroke="#d6dded" stroke-width="1.2"/>
      <text x="213" y="71" class="label" text-anchor="middle">较深的不透明区域</text>
      <text x="213" y="112" class="label" text-anchor="middle">背景采样 → 放大 / 位移</text>
    </g>
    <text x="25" y="306" class="body">底部扭曲真实背景，上半部保持深黑。</text>
    <text x="25" y="337" class="note">需要背景输入；透明度渐变本身不等于折射。</text>
  </g>

  <g transform="translate(1000 158)">
    <rect class="card" width="460" height="372" rx="22"/>
    <circle cx="35" cy="36" r="16" fill="#637ae5"/><text x="35" y="42" class="number">3</text>
    <text x="63" y="44" class="heading">水平双色流动光带</text>
    <rect x="18" y="69" width="424" height="203" rx="15" class="stage"/>
    <g transform="translate(18 69)">
      <use href="#bubble" fill="#090d18"/>
      <g clip-path="url(#bubbleClip)">
        <path d="M82 115C132 96 160 109 191 112S252 124 343 100" fill="none" stroke="url(#warmCold)" stroke-width="29" opacity=".8" filter="url(#bandBlur)"/>
        <path d="M82 115C132 103 160 109 191 112S252 117 343 105" fill="none" stroke="url(#warmCold)" stroke-width="9"/>
        <path d="M115 112C153 107 172 110 194 112S250 114 308 107" fill="none" stroke="#fff4ef" stroke-width="2.8" opacity=".96"/>
      </g>
      <text x="130" y="152" class="label">暖色</text><text x="270" y="152" class="label">冷色</text>
      <path d="M162 163H259" fill="none" stroke="#9ba9ca" stroke-width="1.1" marker-end="url(#arrow)"/>
      <text x="213" y="199" class="small" text-anchor="middle">横向铺开，垂直厚度较薄</text>
    </g>
    <text x="25" y="306" class="body">暖 / 冷双色叠加；细白亮核贯穿中部。</text>
    <text x="25" y="337" class="note">平滑位移与幅度变化，避免成块随机噪点。</text>
  </g>

  <g transform="translate(280 554)">
    <rect class="card" width="460" height="372" rx="22"/>
    <circle cx="35" cy="36" r="16" fill="#637ae5"/><text x="35" y="42" class="number">4</text>
    <text x="63" y="44" class="heading">轮廓高光 + 柔光</text>
    <rect x="18" y="69" width="424" height="203" rx="15" class="stage"/>
    <g transform="translate(18 69)">
      <ellipse cx="213" cy="174" rx="151" ry="28" fill="url(#softFloor)"/>
      <use href="#bubble" fill="#101524"/>
      <path d="M103 151C121 185 302 189 326 150" fill="none" stroke="#e2e7ff" stroke-width="10" opacity=".75" filter="url(#rimBlur)"/>
      <use href="#bubble" fill="none" stroke="url(#rim)" stroke-width="1.6"/>
      <path d="M67 96H98" fill="none" stroke="#8b99b6" stroke-width="1.2"/>
      <text x="22" y="88" class="small">细边</text>
      <path d="M327 176H373" fill="none" stroke="#8b99b6" stroke-width="1.2"/>
      <text x="359" y="165" class="small">柔光</text>
      <text x="213" y="114" class="label" text-anchor="middle">窄高光 + 宽衰减</text>
    </g>
    <text x="25" y="306" class="body">侧面细灰白边，底部有宽而弱的光晕。</text>
    <text x="25" y="337" class="note">轮廓做平滑抗锯齿；亮边和辉光分别控制。</text>
  </g>

  <g transform="translate(760 554)">
    <rect class="card" width="460" height="372" rx="22"/>
    <circle cx="35" cy="36" r="16" fill="#637ae5"/><text x="35" y="42" class="number">5</text>
    <text x="63" y="44" class="heading">状态 / 幅度驱动</text>
    <rect x="18" y="69" width="424" height="203" rx="15" class="stage"/>
    <g transform="translate(18 69)">
      <g font-size="17" text-anchor="middle" fill="#354766">
        <rect x="24" y="22" width="105" height="34" rx="17" fill="#dce4f6"/><text x="76.5" y="45">唤起</text>
        <rect x="159" y="22" width="105" height="34" rx="17" fill="#dce4f6"/><text x="211.5" y="45">聆听</text>
        <rect x="294" y="22" width="105" height="34" rx="17" fill="#dce4f6"/><text x="346.5" y="45">回应</text>
      </g>
      <path d="M136 39H151M271 39H287" stroke="#8390aa" stroke-width="1.3" marker-end="url(#arrow)"/>
      <path d="M36 149H387" stroke="#b6c1d6" stroke-width="1"/>
      <path d="M37 140C56 140 56 119 72 118S89 139 110 137S128 104 146 107S165 142 180 128S196 72 215 81S237 135 254 124S276 99 291 106S310 128 328 122S352 102 386 112" fill="none" stroke="#6d80d9" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M37 140C70 130 85 128 110 125S170 85 215 88S280 125 320 117S360 111 386 112" fill="none" stroke="#af92d0" stroke-width="1.8" stroke-dasharray="5 5"/>
      <text x="38" y="183" class="small">平滑后的幅度</text>
      <text x="308" y="183" class="small">时间 →</text>
    </g>
    <text x="25" y="306" class="body">状态定形状；幅度影响光带和亮度。</text>
    <text x="25" y="337" class="note">统一时间轴与缓动，避免层与层各自乱动。</text>
  </g>

  <path d="M40 963H1460" stroke="#dce3ee"/>
  <text x="50" y="1001" font-size="19" font-weight="550" fill="#33435f">合成顺序：背景 → 折射气泡 → 流动光带 → 高光 / 柔光；形状遮罩与状态贯穿各层。</text>
  <text x="50" y="1035" font-size="16" fill="#76839b">各面板只说明一种职责。图形为代码原生示意，不是 Apple 截图，不推断其实际渲染管线，也不代表已完成实时动画。</text>
</svg>
